name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install lightweight test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "numpy>=1.26" "soundfile>=0.12" "mido>=1.3" pytest

      - name: Static syntax compilation check (py_compile)
        run: python -m py_compile piano_studio.py skills/piano-score-studio/scripts/*.py

      - name: CLI --help smoke test on all scripts
        run: |
          python piano_studio.py --help > /dev/null
          python skills/piano-score-studio/scripts/style_analyzer.py --help > /dev/null
          for script in skills/piano-score-studio/scripts/*.py; do
            echo "Checking --help for $script"
            python "$script" --help > /dev/null
          done

      - name: Run synthetic unit tests
        run: pytest -v tests/
